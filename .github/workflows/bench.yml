name: Benchmarks

# main: full real-world suite, results kept as a per-commit artifact.
# PRs: the crucial benchmarks, base and head measured on the same runner.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
      - '.github/actions/laravel-fixture/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
      - '.github/actions/laravel-fixture/**'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with download-fixtures.sh.
  LARAVEL_FIXTURE_VERSION: v11.44.7
  # Deep PHP AST traversal on Laravel overflows the default rayon stack.
  RUST_MIN_STACK: "16777216"

jobs:
  full:
    name: Benchmark (full suite)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench

      - uses: ./.github/actions/laravel-fixture
        with:
          version: ${{ env.LARAVEL_FIXTURE_VERSION }}

      # Best-effort: governor and turbo knobs are usually absent on cloud VMs.
      - name: Tune system for stable measurements
        run: |
          echo 0 | sudo tee /proc/sys/kernel/randomize_va_space
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
          echo 1 | sudo tee /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null || true

      - name: Run benchmarks
        run: |
          set -eo pipefail
          rm -rf target/criterion
          cargo bench -p mir-analyzer --bench analyze_real_world -- --noplot 2>&1 | tee bench-output.txt
          {
            echo '## Benchmark output'
            echo '```'
            cat bench-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-main-${{ github.sha }}
          path: |
            target/criterion
            bench-output.txt
          retention-days: 90

  # Build base and head at the same checkout path: the fixture path is baked in
  # at compile time and changes lazy-load resolution, which skews comparisons.
  build:
    name: Benchmark (build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The PR merge commit and its first parent (the base branch tip).
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: bench
          save-if: false

      - name: Build head and base benchmarks
        run: |
          set -eo pipefail
          build() {
            mkdir -p "bench-bin/$1"
            cargo bench -p mir-analyzer --bench analyze_real_world --bench incremental_workload \
              --no-run --message-format=json-render-diagnostics \
              | jq -r 'select(.reason == "compiler-artifact" and .executable != null and (.target.kind | index("bench"))) | "\(.target.name) \(.executable)"' \
              | while read -r name exe; do cp "$exe" "bench-bin/$1/$name"; done
          }
          git rev-parse HEAD > bench-bin-head-sha
          build head
          git checkout --detach HEAD^1
          build base
          mv bench-bin-head-sha bench-bin/head-sha
          git rev-parse HEAD > bench-bin/base-sha
          ls -l bench-bin/*

      - uses: actions/upload-artifact@v7
        with:
          name: bench-bin
          path: bench-bin
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  run:
    name: Benchmark (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-cold
            title: CLI cold analysis
            bench: analyze_real_world
            only: bench_full_analysis
          - name: cli-warm
            title: CLI re-analysis with warm cache
            bench: analyze_real_world
            only: bench_reanalysis
          - name: lsp-edit
            title: LSP file edits
            bench: incremental_workload
            only: bench_single_file_edit,bench_high_fanout_edit
          - name: lsp-queries
            title: LSP queries after an edit
            bench: incremental_workload
            only: bench_diagnostics_only_latency,bench_definition_at_after_diagnostics,bench_references_at_after_diagnostics
    env:
      MIR_LARAVEL_FIXTURE: ${{ github.workspace }}/crates/mir-analyzer/benches/fixtures/laravel
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
      MIR_BENCH_ONLY: ${{ matrix.only }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: bench-bin
          path: bench-bin

      - name: Restore binary permissions
        run: chmod +x bench-bin/base/* bench-bin/head/*

      - uses: ./.github/actions/laravel-fixture
        with:
          version: ${{ env.LARAVEL_FIXTURE_VERSION }}

      - name: Cache critcmp
        id: critcmp-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/critcmp
          key: critcmp-${{ runner.os }}-v1

      - name: Install critcmp
        if: steps.critcmp-cache.outputs.cache-hit != 'true'
        run: cargo install critcmp --locked

      - name: Tune system for stable measurements
        run: |
          echo 0 | sudo tee /proc/sys/kernel/randomize_va_space
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
          echo 1 | sudo tee /sys/devices/system/cpu/intel_pstate/no_turbo 2>/dev/null || true

      - name: Run base and head
        run: |
          set -eo pipefail
          mkdir -p result
          for rev in base head; do
            "bench-bin/$rev/${{ matrix.bench }}" --bench --save-baseline "$rev" --noplot 2>&1 \
              | tee "result/output-$rev.txt"
            grep '\[memory\]' "result/output-$rev.txt" | sed 's/^[[:space:]]*//' \
              > "result/memory-$rev.txt" || true
          done
          critcmp base head | tee result/critcmp.txt
          echo '${{ matrix.title }}' > result/title.txt
          {
            echo '## ${{ matrix.title }} (head vs base)'
            echo '```'
            cat result/critcmp.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-result-${{ matrix.name }}
          path: result
          retention-days: 14

  report:
    name: Benchmark (report)
    needs: [build, run]
    if: always() && github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-result-*
          path: results

      - uses: actions/download-artifact@v8
        with:
          name: bench-bin
          path: bench-bin

      - name: Build report
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const read = p => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const sha = rev => read(`bench-bin/${rev}-sha`).trim().slice(0, 10);

            function parseMemory(text) {
              const re = /\[memory\]\s+(.+?):\s+peak live ([\d.]+) MiB,\s+total allocated ([\d.]+) MiB/g;
              const out = {};
              let m;
              while ((m = re.exec(text)) !== null)
                out[m[1].trim()] = { peak: parseFloat(m[2]), total: parseFloat(m[3]) };
              return out;
            }

            function memoryTable(base, head) {
              const keys = [...new Set([...Object.keys(base), ...Object.keys(head)])].sort();
              if (!keys.length) return null;
              const mib = v => v ? `${v.toFixed(1)} MiB` : 'N/A';
              const rows = keys.map(k => {
                const b = base[k], h = head[k];
                let delta = 'N/A';
                if (b && h) {
                  const d = h.peak - b.peak;
                  const s = d >= 0 ? '+' : '';
                  delta = `${s}${d.toFixed(1)} MiB (${s}${(b.peak ? d / b.peak * 100 : 0).toFixed(1)}%)`;
                }
                return `| ${k} | ${mib(b?.peak)} | ${mib(h?.peak)} | ${delta} | ${mib(b?.total)} | ${mib(h?.total)} |`;
              });
              return ['| benchmark | peak (base) | peak (head) | Δ peak | total (base) | total (head) |',
                      '|---|--:|--:|--:|--:|--:|', ...rows].join('\n');
            }

            const legs = ['cli-cold', 'cli-warm', 'lsp-edit', 'lsp-queries'];
            let body = '<!-- mir-bench -->\n## Benchmark results\n\n'
              + `Base \`${sha('base')}\` vs head \`${sha('head')}\`, both measured on the same runner. `
              + 'Shared runners are noisy: treat changes under ~5% as noise.\n';
            for (const leg of legs) {
              const dir = path.join('results', `bench-result-${leg}`);
              const table = read(path.join(dir, 'critcmp.txt'));
              const title = read(path.join(dir, 'title.txt')).trim() || leg;
              body += `\n### ${title}\n`;
              if (!table) {
                body += '\n_No results: the run failed or was cancelled._\n';
                continue;
              }
              body += `\n\`\`\`\n${table}\`\`\`\n`;
              const mem = memoryTable(
                parseMemory(read(path.join(dir, 'memory-base.txt'))),
                parseMemory(read(path.join(dir, 'memory-head.txt'))),
              );
              if (mem) body += `\n${mem}\n`;
            }

            await core.summary.addRaw(body).write();
            fs.writeFileSync('report.md', body);

      # Fork PRs get a read-only token; the step summary still has the report.
      - name: Post or update comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const body = require('fs').readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith('<!-- mir-bench -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
