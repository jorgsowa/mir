name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'harness/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'harness/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cache cargo-outdated
        id: outdated-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-outdated
          key: cargo-outdated-${{ runner.os }}-v1

      - name: Install cargo-outdated
        if: steps.outdated-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-outdated --locked

      - name: Check dependencies
        run: cargo deny check && cargo outdated --format list

      - name: Build mir
        run: cargo build --release -p mir-php

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Cache package fixtures
        id: fixture-cache
        uses: actions/cache@v6.1.0
        with:
          path: harness/fixtures
          key: real-world-fixtures-${{ hashFiles('harness/packages.php', 'harness/download-fixtures.php') }}

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-packages-${{ runner.os }}-${{ hashFiles('harness/packages.php', 'harness/download-fixtures.php') }}

      - name: Download and install fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: harness/download-fixtures.php

      - name: Run baseline harness
        run: harness/run.php

  symfony-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Cache Symfony fixture
        id: symfony-cache
        uses: actions/cache@v6.1.0
        with:
          path: crates/mir-analyzer/benches/fixtures/symfony
          key: symfony-fixture-${{ hashFiles('crates/mir-analyzer/benches/download-symfony-fixture.sh') }}

      - name: Download Symfony fixture
        if: steps.symfony-cache.outputs.cache-hit != 'true'
        run: bash crates/mir-analyzer/benches/download-symfony-fixture.sh

      # Whole tree incl. Tests fixtures on 2 MiB rayon workers (debug frames are the largest).
      - name: Full Symfony tree on default worker stacks
        run: cargo test -p mir-analyzer --test it symfony_full -- --ignored

      # Run from outside the fixture so its psalm.xml exclusions don't narrow the file set.
      - name: Full Symfony tree through the release CLI
        shell: bash
        run: |
          cargo build --release -p mir-php
          set +e
          "$PWD/target/release/mir" "$PWD/crates/mir-analyzer/benches/fixtures/symfony/src" --no-progress --no-cache > /dev/null
          code=$?
          # 0/1 mean "analyzed, with/without issues"; anything else is a crash.
          if [ "$code" -gt 1 ]; then echo "mir crashed with exit code $code"; exit 1; fi

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        shell: bash
        run: cargo nextest run --workspace --profile ci -E 'not binary(fixtures)'

      # One process so the pooled stub-indexed sessions are reused across fixtures.
      - name: Fixture tests
        shell: bash
        run: cargo test -p mir-analyzer --test fixtures -- --test-threads=4

      - name: Doctests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --workspace --doc
