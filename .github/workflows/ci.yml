name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYMFONY_FIXTURE_COMMIT: 27515cd

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install dependency checkers
        run: cargo install cargo-deny cargo-outdated --locked

      - name: Check dependencies
        run: cargo deny check && cargo outdated --format list

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        shell: bash
        run: cargo nextest run --workspace --profile ci

      - name: Doctests
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --workspace --doc

  symfony-salsa:
    name: Symfony Salsa Queries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Cache Symfony fixture
        id: symfony-fixture-cache
        uses: actions/cache@v6.1.0
        with:
          path: crates/mir-analyzer/benches/fixtures/symfony
          key: symfony-fixture-${{ env.SYMFONY_FIXTURE_COMMIT }}

      - name: Download Symfony fixture
        if: steps.symfony-fixture-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash crates/mir-analyzer/benches/download-symfony-fixture.sh

      - name: Run Symfony Salsa query tests
        shell: bash
        env:
          MIR_SYMFONY_FIXTURE: ${{ github.workspace }}/crates/mir-analyzer/benches/fixtures/symfony
        run: |
          set -euo pipefail
          for t in crates/mir-analyzer/tests/symfony_query_*.rs; do
            name="$(basename "${t%.rs}")"
            cargo test -p mir-analyzer --test "$name" -- --ignored --nocapture
          done
